<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#DDEFF8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>洗濯表示 フラッシュカード｜特別支援教材開発研究所（TKK）</title>
<meta name="description" content="小学校の家庭科で学ぶ洗濯表示（取扱い表示）21種類の意味を、タップで確かめられるフラッシュカード。洗い方・漂白・乾かし方・アイロン・クリーニングから選んで練習できます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#DDEFF8;
    --chip:#C9E3F0;
    --card:#FFFDF7;
    --ink:#4A4038;
    --ink-soft:#8C8073;
    --line:#B9D7E6;
    --blue:#AFD8E8;   --blue-d:#7FAEC3;
    --pink:#F7C9C9;   --pink-d:#D79E9E;
    --yellow:#F8E1A0; --yellow-d:#D3B96C;
    --green:#BFE4AF;  --green-d:#92BC7F;
    --purple:#D8CAEE; --purple-d:#AE9CCC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"BIZ UDPGothic",system-ui,-apple-system,sans-serif;
    min-height:100vh;min-height:100dvh;overscroll-behavior:none;
  }
  button{touch-action:manipulation;}
  .screen{
    max-width:680px;margin:0 auto;min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
    padding:
      calc(12px + env(safe-area-inset-top)) clamp(12px,4vw,20px)
      calc(16px + env(safe-area-inset-bottom));
    gap:clamp(8px,2vh,14px);
  }
  .screen[hidden]{display:none;}
  #screenSetup{height:100vh;height:100dvh;}
  .setup-body{min-height:0;}

  h1{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
    font-size:clamp(19px,5.4vw,26px);margin:0;letter-spacing:.02em;
  }

  /* ---- ボタン ---- */
  .btn{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;color:var(--ink);
    border:none;border-radius:16px;
    background:var(--yellow);box-shadow:0 5px 0 var(--yellow-d);
    padding:clamp(12px,2.8vh,16px) 10px;font-size:clamp(15px,4.2vw,18px);
    cursor:pointer;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--yellow-d);}
  .btn:focus-visible{outline:3px solid var(--purple-d);outline-offset:2px;}
  .btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d);}
  .btn.green:active{box-shadow:0 1px 0 var(--green-d);}
  .btn.pink{background:var(--pink);box-shadow:0 5px 0 var(--pink-d);}
  .btn.pink:active{box-shadow:0 1px 0 var(--pink-d);}
  .btn.purple{background:var(--purple);box-shadow:0 5px 0 var(--purple-d);}
  .btn.purple:active{box-shadow:0 1px 0 var(--purple-d);}
  .btn.big{font-size:clamp(19px,5.6vw,25px);padding:clamp(15px,3.4vh,20px) 10px;border-radius:20px;}
  .btn:disabled{
    opacity:.38;cursor:not-allowed;
    background:#C3D3DC;box-shadow:0 5px 0 #A9BCC7;
  }
  .btn:disabled:active{transform:none;box-shadow:0 5px 0 #A9BCC7;}

  /* ---- せってい ---- */
  .setup-body{flex:1;overflow-y:auto;padding-bottom:6px;}
  .group{margin-bottom:18px;}
  .group h2{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
    font-size:clamp(14px,3.9vw,17px);margin:0 0 8px;
    display:flex;align-items:center;justify-content:flex-start;gap:10px;
  }
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .seg.two{grid-template-columns:repeat(2,1fr);}
  .opt{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
    font-size:clamp(13px,3.6vw,16px);color:var(--ink);
    background:var(--chip);border:3px solid var(--chip);border-radius:14px;
    padding:12px 4px;min-height:48px;cursor:pointer;text-align:center;
    transition:transform .06s ease;
  }
  .opt:active{transform:scale(.97);}
  .opt[aria-pressed="true"]{background:var(--card);border-color:var(--blue-d);box-shadow:0 0 0 2px var(--blue-d) inset;}
  .opt:focus-visible{outline:3px solid var(--purple-d);outline-offset:2px;}
  .count-num{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
    font-size:clamp(26px,7.4vw,34px);line-height:1;color:var(--ink);
    min-width:1.6em;text-align:right;
  }
  .range{
    -webkit-appearance:none;appearance:none;display:block;
    width:100%;height:48px;margin:0;padding:0 2px;background:transparent;
    cursor:pointer;touch-action:manipulation;--p:10%;
  }
  .range:focus{outline:none;}
  .range:focus-visible{outline:3px solid var(--purple-d);outline-offset:2px;border-radius:14px;}
  .range::-webkit-slider-runnable-track{
    height:14px;border-radius:999px;
    background:linear-gradient(to right,var(--blue-d) 0,var(--blue-d) var(--p),#BFD9E6 var(--p),#BFD9E6 100%);
  }
  .range::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:38px;height:38px;margin-top:-12px;
    border-radius:50%;background:var(--card);border:4px solid var(--blue-d);
    box-shadow:0 3px 0 rgba(120,100,70,.18);
  }
  .range::-moz-range-track{height:14px;border-radius:999px;background:#BFD9E6;}
  .range::-moz-range-progress{height:14px;border-radius:999px;background:var(--blue-d);}
  .range::-moz-range-thumb{
    width:30px;height:30px;border-radius:50%;background:var(--card);border:4px solid var(--blue-d);
    box-shadow:0 3px 0 rgba(120,100,70,.18);
  }
  .range-scale{
    display:flex;justify-content:space-between;
    font-size:clamp(11.5px,3.1vw,13px);color:var(--ink-soft);padding:0 6px;
  }

  /* えらぶ：なかまごとの 記号 */
  .cat-block{margin-bottom:12px;}
  .cat-head{
    display:flex;align-items:center;gap:10px;margin:0 0 6px;
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
    font-size:clamp(13px,3.6vw,15px);color:var(--ink);
  }
  .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:7px;}
  .opt.s{padding:6px;min-height:60px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
  .opt.s svg{width:40px;height:40px;display:block;}
  .opt.s{--hand-bg:var(--chip);}
  .opt.s[aria-pressed="true"]{--hand-bg:var(--card);}
  .sym{--hand-bg:var(--card);}
  .all{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
    font-size:clamp(11.5px,3.1vw,13px);color:var(--ink);
    background:var(--yellow);border:none;border-radius:11px;
    padding:6px 15px;min-height:32px;cursor:pointer;flex:none;
  }
  .all:active{transform:translateY(2px);}
  .all:focus-visible{outline:3px solid var(--purple-d);outline-offset:2px;}
  .help{font-size:clamp(11.5px,3.1vw,13px);color:var(--ink-soft);line-height:1.7;margin:7px 0 0;}
  .foot{border-top:2px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:9px;}
  .summary{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:500;
    font-size:clamp(12.5px,3.4vw,15px);color:var(--ink-soft);text-align:center;margin:0;
  }
  footer{text-align:center;font-size:11px;color:#B3A796;padding-top:8px;line-height:1.6;}

  /* ---- カード ---- */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .back-btn{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;color:var(--ink);
    background:var(--purple);border:none;border-radius:999px;
    padding:10px 17px;min-height:44px;font-size:clamp(13px,3.5vw,15px);cursor:pointer;
    box-shadow:0 4px 0 var(--purple-d);
  }
  .back-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--purple-d);}
  .back-btn:focus-visible{outline:3px solid var(--purple-d);outline-offset:2px;}
  .pause-btn{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;color:var(--ink);
    background:var(--yellow);border:none;border-radius:999px;
    padding:10px 17px;min-height:44px;font-size:clamp(13px,3.5vw,15px);cursor:pointer;
    box-shadow:0 4px 0 var(--yellow-d);
  }
  .pause-btn[hidden]{display:none;}
  .pause-btn[aria-pressed="true"]{background:var(--green);box-shadow:0 4px 0 var(--green-d);}
  .pause-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--yellow-d);}
  .pause-btn:focus-visible{outline:3px solid var(--purple-d);outline-offset:2px;}
  .counter{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:500;
    color:var(--ink-soft);font-size:clamp(13px,3.6vw,16px);margin:0;
  }
  .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;}
  .card-wrap{width:100%;height:clamp(320px,68dvh,560px);}
  .card{
    position:relative;width:100%;height:100%;
    cursor:pointer;user-select:none;-webkit-user-select:none;
  }
  .card:focus-visible{outline:3px solid var(--purple-d);outline-offset:6px;border-radius:28px;}
  .face{
    position:absolute;inset:0;
    background:var(--card);border:3px solid var(--line);border-radius:28px;
    box-shadow:0 7px 0 rgba(60,110,140,.16);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(10px,2.4vh,20px);padding:16px 16px 40px;text-align:center;
  }
  .sym{
    width:min(48vw,32dvh,250px);height:min(48vw,32dvh,250px);
    color:var(--ink);flex:none;
  }
  .sym svg{width:100%;height:100%;display:block;}
  /* こたえ：高さは先に確保し、タップで表示だけ切り替える（記号の位置が動かない） */
  .answer{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    min-height:clamp(110px,18dvh,150px);max-width:100%;
    visibility:hidden;
  }
  .card.flipped .answer{visibility:visible;}
  .cat-tag{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
    font-size:clamp(12px,3.3vw,14px);color:var(--ink);
    background:var(--blue);border-radius:999px;padding:3px 12px;
  }
  .meaning{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
    font-size:clamp(21px,6vw,32px);line-height:1.45;
    max-width:100%;overflow-wrap:anywhere;word-break:keep-all;
  }
  .sub{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:500;
    font-size:clamp(14px,3.9vw,18px);color:var(--ink-soft);
    background:#E6F2F8;border-radius:11px;padding:5px 12px;
  }
  .sub[hidden]{display:none;}
  .hint{position:absolute;bottom:14px;left:0;right:0;font-size:clamp(11px,3vw,13px);color:#B3A796;}

  /* ---- おめでとう ---- */
  .done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;}
  .done svg{width:clamp(130px,42vw,210px);height:auto;}
  .done h2{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
    font-size:clamp(30px,9vw,50px);margin:0;
  }
  .done p{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:500;
    font-size:clamp(15px,4.4vw,20px);color:var(--ink-soft);margin:0;
  }
  .done-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
</style>
</head>
<body>

<!-- ============ 1. せってい ============ -->
<div class="screen" id="screenSetup">
  <h1>洗濯表示 フラッシュカード</h1>

  <div class="setup-body">
    <div class="group">
      <h2>だしかた</h2>
      <div class="seg" id="segMode">
        <button class="opt" data-mode="all" aria-pressed="false">ぜんぶ</button>
        <button class="opt" data-mode="pick" aria-pressed="false">えらぶ</button>
        <button class="opt" data-mode="random" aria-pressed="false">ランダム</button>
      </div>
      <p class="help" id="modeHelp">だしかたを えらんで ください。</p>
    </div>

    <div class="group" id="groupRandom" hidden>
      <h2>もんだいの かず <span class="count-num" id="countNum">10</span>もん</h2>
      <input class="range" type="range" id="countRange" min="1" max="21" step="1" value="10" aria-label="もんだいの かず">
      <div class="range-scale"><span>1</span><span id="countMax">21</span></div>
    </div>

    <div class="group">
      <h2>すすめかた</h2>
      <div class="seg two" id="segAuto">
        <button class="opt" data-auto="tap" aria-pressed="true">タップ</button>
        <button class="opt" data-auto="auto" aria-pressed="false">じどう</button>
      </div>
      <p class="help" id="autoHelp">タップして めくります。</p>
    </div>

    <div class="group" id="groupSec" hidden>
      <h2>びょうすう <span class="count-num" id="secNum">3</span>びょう</h2>
      <input class="range" type="range" id="secRange" min="1" max="10" step="0.5" value="3" aria-label="びょうすう">
      <div class="range-scale"><span>1</span><span>10</span></div>
    </div>

    <div class="group" id="groupPick" hidden>
      <h2>きごうを えらぶ（ふくすうOK）<button class="all" id="pickAll">ぜんぶ</button></h2>
      <div id="pickArea"></div>
    </div>
  </div>

  <div class="foot">
    <p class="summary" id="summary">だしかたを えらんで ください</p>
    <button class="btn big green" id="btnStart" disabled>スタート</button>
    <footer>きごうの いみは JIS L 0001:2024（2024年8月改正）に もとづきます<br>© 特別支援教材開発研究所</footer>
  </div>
</div>

<!-- ============ 2. カード ============ -->
<div class="screen" id="screenCard" hidden>
  <div class="bar">
    <button class="back-btn" id="btnBack">← もどる</button>
    <button class="pause-btn" id="btnPause" aria-pressed="false" hidden>とめる</button>
    <p class="counter" id="counter">1 / 21</p>
  </div>

  <div class="stage">
    <div class="card-wrap">
      <div class="card" id="card" role="button" tabindex="0" aria-label="カードをめくる">
        <div class="face">
          <div class="sym" id="frontSym"></div>
          <div class="answer" id="answer">
            <div class="cat-tag" id="catTag"></div>
            <div class="meaning" id="meaning"></div>
            <div class="sub" id="note" hidden></div>
          </div>
          <div class="hint" id="hint">タップして いみ</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ 3. おめでとう ============ -->
<div class="screen" id="screenDone" hidden>
  <div class="done">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <path d="M70 120 L52 186 L100 158 L148 186 L130 120 Z" fill="#F7C9C9"/>
      <circle cx="100" cy="86" r="62" fill="#F8E1A0" stroke="#D3B96C" stroke-width="6"/>
      <circle cx="100" cy="86" r="45" fill="#FFFDF7"/>
      <path d="M100 52 l9.5 21.5 23.5 2.4 -17.6 15.8 4.9 23.1 -20.3 -12 -20.3 12 4.9 -23.1 -17.6 -15.8 23.5 -2.4 Z" fill="#F8E1A0"/>
    </svg>
    <h2>おめでとう！</h2>
    <p id="doneText">ぜんぶで 21まい れんしゅうしました</p>
  </div>
  <div class="done-btns">
    <button class="btn pink" id="btnAgain">もういっかい</button>
    <button class="btn purple" id="btnToSetup">もどる</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ============ データ ============ */
  /* 意味は JIS L 0001:2024（繊維製品品質表示規程 2024年8月20日改正）にもとづき、子ども向けに言いかえ */
  var CATS = [
    { id: "wash",   name: "あらいかた" },
    { id: "bleach", name: "ひょうはく" },
    { id: "dry",    name: "かわかしかた" },
    { id: "iron",   name: "アイロン" },
    { id: "clean",  name: "クリーニング" }
  ];

  var SYMBOLS = [
    { id: "w40",   cat: "wash",   mean: "せんたくきで あらえる",              note: "水の おんどは 40℃まで" },
    { id: "w40b",  cat: "wash",   mean: "せんたくきで よわく あらえる",        note: "水の おんどは 40℃まで" },
    { id: "w30bb", cat: "wash",   mean: "せんたくきで とても よわく あらえる", note: "水の おんどは 30℃まで" },
    { id: "hand",  cat: "wash",   mean: "手あらいが できる",                   note: "水の おんどは 40℃まで" },
    { id: "wx",    cat: "wash",   mean: "家では せんたく できない" },
    { id: "b",     cat: "bleach", mean: "ひょうはくざいが つかえる",           note: "えんそけい・さんそけい どちらも OK" },
    { id: "bo",    cat: "bleach", mean: "さんそけいの ひょうはくざいだけ つかえる", note: "えんそけいは つかえない" },
    { id: "bx",    cat: "bleach", mean: "ひょうはくざいは つかえない" },
    { id: "t",     cat: "dry",    mean: "かんそうきで かわかせる",             note: "はいきの おんどは 80℃まで" },
    { id: "tx",    cat: "dry",    mean: "かんそうきは つかえない" },
    { id: "line",  cat: "dry",    mean: "つりぼしが よい",                     note: "ハンガーなどに つるして ほす" },
    { id: "flat",  cat: "dry",    mean: "ひらぼしが よい",                     note: "たいらに おいて ほす" },
    { id: "sline", cat: "dry",    mean: "日かげで つりぼしが よい" },
    { id: "sflat", cat: "dry",    mean: "日かげで ひらぼしが よい" },
    { id: "i3",    cat: "iron",   mean: "高い おんどで アイロンが かけられる", note: "おんどは 210℃まで" },
    { id: "i2",    cat: "iron",   mean: "中くらいの おんどで アイロンが かけられる", note: "おんどは 160℃まで" },
    { id: "i1",    cat: "iron",   mean: "ひくい おんどで アイロンが かけられる", note: "おんどは 120℃まで" },
    { id: "ix",    cat: "iron",   mean: "アイロンは かけられない" },
    { id: "f",     cat: "clean",  mean: "クリーニング店で ドライクリーニングが できる", note: "せきゆけいの ようざいを つかう" },
    { id: "wet",   cat: "clean",  mean: "クリーニング店で ウエットクリーニングが できる", note: "プロの 水あらい" },
    { id: "dx",    cat: "clean",  mean: "ドライクリーニングは できない" }
  ];

  var IDS = SYMBOLS.map(function (s) { return s.id; });
  var BY_ID = {};
  SYMBOLS.forEach(function (s) { BY_ID[s.id] = s; });
  var CAT_NAME = {};
  CATS.forEach(function (c) { CAT_NAME[c.id] = c.name; });

  /* ============ 洗濯表示のSVG ============ */
  /* 消費者庁「洗濯表示（令和6年8月20日以降）」の図形を参考に描画（近似SVG）。 */
  function symbolSvg(id) {
    var S = 'fill="none" stroke="currentColor" stroke-width="4.8" stroke-linecap="square" stroke-linejoin="miter"';

    /* 洗濯おけ：波線を上端に置く（中央ではなく、実際の洗濯表示の配置） */
    var TUB = '<path stroke-linejoin="round" d="M18 75 L10 16 Q17 8 24 16 Q31 24 38 16 Q45 8 52 16 ' +
      'Q59 24 66 16 Q73 8 80 16 Q85 22 90 16 L82 75 Z"/>';
    var BAR1 = '<path d="M21 84 H79"/>';
    var BAR2 = '<path d="M21 94 H79"/>';
    var TRI = '<path d="M50 9 L94 85 H6 Z"/>';
    var SQ = '<rect x="12" y="12" width="76" height="76"/>';
    /* 公式のアイロン形は上辺が水平で、右側は斜め、左側は低い位置からつながる。 */
    var IRON = '<path d="M28 23 H74 L91 78 H8 L24 49 Q27 44 33 44 H80"/>';
    var CIR = '<circle cx="50" cy="50" r="38"/>';
    var X = '<path d="M7 7 L93 93 M93 7 L7 93"/>';

    /* 禁止の×は図形に応じて範囲を変え、洗濯おけやアイロンの下にはみ出さない */
    var X_TUB  = '<path d="M10 16 L90 75 M90 16 L10 75"/>';
    var X_TRI = '<path d="M7 21 L93 81 M93 21 L7 81"/>';
    var X_IRON = '<path d="M8 22 L91 78 M91 22 L8 78"/>';

    function num(n) {
      return '<text x="50" y="62" text-anchor="middle" font-size="28" font-weight="700" ' +
        'font-family="BIZ UDPGothic, Arial, sans-serif" fill="currentColor" stroke="none">' + n + '</text>';
    }
    function letter(c) {
      return '<text x="50" y="65" text-anchor="middle" font-size="44" font-weight="700" ' +
        'font-family="BIZ UDPGothic, Arial, sans-serif" fill="currentColor" stroke="none">' + c + '</text>';
    }
    function dots(xs, y, r) {
      return xs.map(function (x) {
        return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="currentColor" stroke="none"/>';
      }).join("");
    }

    /* 手洗い：手と指が桶に入る形。背景色で奥側の波線を隠す */
    var HAND = '<g stroke-width="3.8" transform="translate(0 -6)"><path fill="var(--hand-bg,#FFFDF7)" d="M40 3 Q40 16 36 24 ' +
      'L28 36 Q26 41 31 41 L38 36 L38 63 Q38 69 41.25 69 Q44.5 69 44.5 64 ' +
      'Q44.5 72 47.75 72 Q51 72 51 65 Q51 72 54.25 72 Q57.5 72 57.5 64 ' +
      'Q57.5 70 60.75 70 Q64 70 64 63 L64 40 Q64 28 60 20 Q59 12 59 3"/>' +
      '<path d="M44.5 48 V64 M51 47 V65 M57.5 48 V64"/></g>';

    var body = {
      w40:   TUB + num(40),
      w40b:  TUB + num(40) + BAR1,
      w30bb: TUB + num(30) + BAR1 + BAR2,
      hand:  TUB + HAND,
      wx:    TUB + X_TUB,
      b:     TRI,
      /* 酸素系のみ：三角形の底辺から右辺へつながる平行な二本の斜線 */
      bo:    TRI + '<path stroke-linecap="butt" d="M26.6 84 L61.4 31 M50.7 84 L73.3 52"/>',
      bx:    TRI + X_TRI,
      /* タンブル乾燥：内接円と温度を示す点 */
      t:     SQ + '<circle cx="50" cy="50" r="33"/>' + dots([42, 58], 50, 5),
      tx:    SQ + '<circle cx="50" cy="50" r="33"/>' + X,
      /* 自然乾燥の縦・横・左上の斜線 */
      line:  SQ + '<path d="M50 23 V77"/>',
      flat:  SQ + '<path d="M23 50 H77"/>',
      sline: SQ + '<path d="M50 23 V77 M12 42 L42 12"/>',
      sflat: SQ + '<path d="M23 50 H77 M12 42 L42 12"/>',
      i3:    IRON + dots([39, 53, 67], 64, 4.6),
      i2:    IRON + dots([46, 61], 64, 4.6),
      i1:    IRON + dots([54], 64, 4.6),
      ix:    IRON + X_IRON,
      f:     CIR + letter("F"),
      wet:   CIR + letter("W"),
      dx:    CIR + X
    }[id] || "";
    return '<svg viewBox="0 0 100 100" ' + S + ' aria-hidden="true">' + body + '</svg>';
  }

  /* ============ 状態 ============ */
  var state = {
    mode: null,      /* all | pick | random */
    count: 10,       /* ランダムの もんだいの かず（1〜ぜんぶ） */
    picked: [],      /* えらぶ で選んだ記号の id */
    deck: [],
    pos: 0,
    flipped: false,
    auto: 0,         /* いまの びょうすう（0＝タップ） */
    sec: 3,          /* じどうの びょうすう（1〜10、0.5きざみ） */
    paused: false
  };
  var timer = null;

  /* ============ 純粋ロジック ============ */
  function shuffleArr(arr, rnd) {
    var a = arr.slice(), i, j, t, r = rnd || Math.random;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(r() * (i + 1));
      if (j > i) j = i;
      if (j < 0) j = 0;
      t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* 一覧の順に並べ直す（知らない id はのぞく） */
  function inListOrder(ids) {
    return IDS.filter(function (k) { return ids.indexOf(k) !== -1; });
  }

  var SEC_MIN = 1, SEC_MAX = 10;
  function clampSec(n) {
    n = Math.round(Number(n) * 2) / 2;
    if (!isFinite(n)) n = 3;
    return Math.max(SEC_MIN, Math.min(SEC_MAX, n));
  }

  function clampCount(n) {
    n = Math.round(Number(n));
    if (!isFinite(n)) n = 10;
    return Math.max(1, Math.min(IDS.length, n));
  }

  function buildDeck(mode, picked, rnd, count) {
    if (mode === "all") return IDS.slice();
    if (mode === "pick") return inListOrder(picked);
    if (mode === "random") return shuffleArr(IDS, rnd).slice(0, clampCount(count));
    return [];
  }

  function deckSize(mode, picked, count) {
    if (mode === "all") return IDS.length;
    if (mode === "pick") return inListOrder(picked).length;
    if (mode === "random") return clampCount(count);
    return 0;
  }

  function idsOfCat(cat) {
    return SYMBOLS.filter(function (s) { return s.cat === cat; }).map(function (s) { return s.id; });
  }

  /* なかまの記号を まとめて入れる／はずす（ぜんぶ入っていれば はずす） */
  function toggleCat(picked, cat) {
    var ids = idsOfCat(cat);
    var allIn = ids.every(function (k) { return picked.indexOf(k) !== -1; });
    if (allIn) return picked.filter(function (k) { return ids.indexOf(k) === -1; });
    var out = picked.slice();
    ids.forEach(function (k) { if (out.indexOf(k) === -1) out.push(k); });
    return out;
  }

  /* ============ DOM ============ */
  var $ = function (id) { return document.getElementById(id); };
  var elCard = $("card");

  function show(name) {
    if (name !== "card") clearTimer();
    $("screenSetup").hidden = (name !== "setup");
    $("screenCard").hidden  = (name !== "card");
    $("screenDone").hidden  = (name !== "done");
    if (name === "card") elCard.focus();
    else if (name === "done") $("btnAgain").focus();
    else if (window.scrollTo) { try { window.scrollTo(0, 0); } catch (e) {} }
  }

  function render() {
    if (!state.deck.length) return;
    var s = BY_ID[state.deck[state.pos]];
    $("frontSym").innerHTML = symbolSvg(s.id);
    $("catTag").textContent = CAT_NAME[s.cat];
    $("meaning").textContent = s.mean;
    if (s.note) {
      $("note").textContent = s.note;
      $("note").hidden = false;
    } else {
      $("note").hidden = true;
    }
    $("counter").textContent = (state.pos + 1) + " / " + state.deck.length;
    elCard.classList.toggle("flipped", state.flipped);
    if (state.auto) {
      $("hint").textContent = state.paused ? "とまっています（タップで すすみます）" : "じどうで すすみます";
    } else {
      $("hint").textContent = state.flipped ? "タップで つぎへ" : "タップして いみ";
    }
    $("btnPause").hidden = !state.auto;
    $("btnPause").textContent = state.paused ? "うごかす" : "とめる";
    $("btnPause").setAttribute("aria-pressed", state.paused ? "true" : "false");
    elCard.setAttribute("aria-label", state.flipped ? ("こたえ：" + s.mean) : "もんだい（洗濯表示）");
  }

  function setPct(el, min, max, v) {
    el.style.setProperty("--p", ((v - min) / (max - min) * 100) + "%");
  }

  function updateSetup() {
    var modes = document.querySelectorAll("[data-mode]");
    for (var i = 0; i < modes.length; i++) {
      modes[i].setAttribute("aria-pressed", modes[i].getAttribute("data-mode") === state.mode ? "true" : "false");
    }
    $("groupPick").hidden = (state.mode !== "pick");
    $("groupRandom").hidden = (state.mode !== "random");

    var range = $("countRange");
    if (Number(range.value) !== state.count) range.value = String(state.count);
    setPct(range, 1, IDS.length, state.count);
    range.setAttribute("aria-valuetext", state.count + "もん");
    $("countNum").textContent = state.count;

    var autos = document.querySelectorAll("[data-auto]");
    for (var a = 0; a < autos.length; a++) {
      var isAuto = autos[a].getAttribute("data-auto") === "auto";
      autos[a].setAttribute("aria-pressed", (isAuto === !!state.auto) ? "true" : "false");
    }
    $("groupSec").hidden = !state.auto;
    var sr = $("secRange");
    if (Number(sr.value) !== state.sec) sr.value = String(state.sec);
    setPct(sr, SEC_MIN, SEC_MAX, state.sec);
    sr.setAttribute("aria-valuetext", state.sec + "びょう");
    $("secNum").textContent = state.sec;
    $("autoHelp").textContent = state.auto
      ? "もんだい → " + state.auto + "びょう → こたえ → " + state.auto + "びょう → つぎの もんだい"
      : "タップして めくります。";

    var chips = document.querySelectorAll(".opt.s");
    for (var j = 0; j < chips.length; j++) {
      var on = state.picked.indexOf(chips[j].getAttribute("data-id")) !== -1;
      chips[j].setAttribute("aria-pressed", on ? "true" : "false");
    }

    var total = IDS.length;
    var help = {
      all: total + "こを じゅんばんに だします。",
      pick: "れんしゅうしたい きごうを タップして えらびます。",
      random: total + "この中から " + state.count + "こを ランダムに だします。"
    };
    $("modeHelp").textContent = state.mode ? help[state.mode] : "だしかたを えらんで ください。";

    var n = deckSize(state.mode, state.picked, state.count);
    $("btnStart").disabled = (n === 0);
    if (!state.mode) $("summary").textContent = "だしかたを えらんで ください";
    else if (n === 0) $("summary").textContent = "きごうを えらんで ください";
    else $("summary").textContent = "ぜんぶで " + n + "まい" + (state.auto ? "（" + state.auto + "びょうで じどう）" : "");
  }

  function start() {
    var deck = buildDeck(state.mode, state.picked, null, state.count);
    if (!deck.length) return;
    state.deck = deck;
    state.pos = 0;
    state.flipped = false;
    state.paused = false;
    render();
    show("card");
    schedule();
  }

  /* ============ じどう ============ */
  function clearTimer() {
    if (timer !== null) { clearTimeout(timer); timer = null; }
  }

  function schedule() {
    clearTimer();
    if (!state.auto || state.paused || !state.deck.length || $("screenCard").hidden) return;
    timer = setTimeout(function () { timer = null; advance(); }, state.auto * 1000);
  }

  function togglePause() {
    if (!state.auto || $("screenCard").hidden) return;
    state.paused = !state.paused;
    render();
    schedule();
  }

  function finish() {
    $("doneText").textContent = "ぜんぶで " + state.deck.length + "まい れんしゅうしました";
    show("done");
  }

  function advance() {
    if (!state.deck.length || $("screenCard").hidden) return;
    if (state.flipped) {
      if (state.pos >= state.deck.length - 1) { finish(); return; }
      state.pos += 1;
      state.flipped = false;
    } else {
      state.flipped = true;
    }
    render();
    schedule();
  }

  function goBack() {
    if (!state.deck.length || $("screenCard").hidden) return;
    if (state.flipped) { state.flipped = false; }
    else if (state.pos > 0) { state.pos -= 1; state.flipped = false; }
    render();
    schedule();
  }

  /* ============ えらぶ の一覧 ============ */
  $("countRange").max = String(IDS.length);
  $("countMax").textContent = IDS.length;

  (function buildPick() {
    var frag = document.createDocumentFragment();
    CATS.forEach(function (c) {
      var block = document.createElement("div");
      block.className = "cat-block";
      var head = document.createElement("div");
      head.className = "cat-head";
      head.appendChild(document.createTextNode(c.name));
      var cb = document.createElement("button");
      cb.type = "button";
      cb.className = "all";
      cb.setAttribute("data-cat", c.id);
      cb.textContent = "まとめて";
      head.appendChild(cb);
      block.appendChild(head);
      var grid = document.createElement("div");
      grid.className = "sgrid";
      SYMBOLS.forEach(function (s) {
        if (s.cat !== c.id) return;
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt s";
        b.setAttribute("data-id", s.id);
        b.setAttribute("aria-pressed", "false");
        b.setAttribute("aria-label", s.mean);
        b.innerHTML = symbolSvg(s.id);
        grid.appendChild(b);
      });
      block.appendChild(grid);
      frag.appendChild(block);
    });
    $("pickArea").appendChild(frag);
  })();

  /* ============ イベント ============ */
  $("segMode").addEventListener("click", function (e) {
    var b = e.target.closest("[data-mode]");
    if (!b) return;
    var m = b.getAttribute("data-mode");
    if (m === "pick" && state.mode !== "pick") state.picked = [];
    state.mode = m;
    updateSetup();
    if (m === "random") reveal($("groupRandom"));
  });

  function reveal(el) {
    if (!el || el.hidden || !el.scrollIntoView) return;
    try { el.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e) {}
  }

  $("segAuto").addEventListener("click", function (e) {
    var b = e.target.closest("[data-auto]");
    if (!b) return;
    state.auto = (b.getAttribute("data-auto") === "auto") ? state.sec : 0;
    updateSetup();
    if (state.auto) reveal($("groupSec"));
  });

  $("secRange").addEventListener("input", function () {
    state.sec = clampSec(this.value);
    if (state.auto) state.auto = state.sec;
    updateSetup();
  });

  $("btnPause").addEventListener("click", togglePause);

  $("countRange").addEventListener("input", function () {
    state.count = clampCount(this.value);
    updateSetup();
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && state.auto && !state.paused && !$("screenCard").hidden) {
      state.paused = true;
      render();
      clearTimer();
    }
  });

  $("pickArea").addEventListener("click", function (e) {
    var cb = e.target.closest("[data-cat]");
    if (cb) {
      state.picked = toggleCat(state.picked, cb.getAttribute("data-cat"));
      updateSetup();
      return;
    }
    var b = e.target.closest(".opt.s");
    if (!b) return;
    var k = b.getAttribute("data-id"), i = state.picked.indexOf(k);
    if (i === -1) state.picked.push(k); else state.picked.splice(i, 1);
    updateSetup();
  });

  $("pickAll").addEventListener("click", function () {
    state.picked = (inListOrder(state.picked).length === IDS.length) ? [] : IDS.slice();
    updateSetup();
  });

  $("btnStart").addEventListener("click", start);
  $("btnAgain").addEventListener("click", start);
  $("btnToSetup").addEventListener("click", function () { show("setup"); });
  $("btnBack").addEventListener("click", function () { show("setup"); });

  elCard.addEventListener("click", advance);
  elCard.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); advance(); }
  });

  document.addEventListener("keydown", function (e) {
    if ($("screenCard").hidden) {
      if (e.key === "Escape" && !$("screenDone").hidden) show("setup");
      return;
    }
    if (e.key === "ArrowRight") { e.preventDefault(); advance(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); goBack(); }
    else if (e.key === "Escape") { show("setup"); }
  });

  updateSetup();
  show("setup");

  /* テスト用（UIには影響しません） */
  window.__tkk = {
    SYMBOLS: SYMBOLS, CATS: CATS, IDS: IDS, state: state,
    getTimer: function () { return timer; },
    buildDeck: buildDeck, deckSize: deckSize, clampCount: clampCount, clampSec: clampSec,
    shuffleArr: shuffleArr, toggleCat: toggleCat, symbolSvg: symbolSvg
  };
})();
</script>
</body>
</html>
